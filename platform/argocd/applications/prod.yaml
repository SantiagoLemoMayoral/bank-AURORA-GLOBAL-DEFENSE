apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platform-prod
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: github.com/SantiagoLemoMayoral/bank-AURORA-GLOBAL-DEFENSE
    targetRevision: main
    path: gitops/environments/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true