apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition

metadata:
  name: caches.platform.bank.io

spec:
  group: platform.bank.io

  names:
    kind: Cache
    plural: caches

  defaultCompositionRef:
    name: cache-aws

  versions:
    - name: v1alpha1

      served: true
      referenceable: true

      schema:
        openAPIV3Schema:
          type: object

          properties:

            spec:
              type: object

              required:
                - region
                - size
                - engine
                - environment

              properties:
                region:
                  type: string
                  enum:
                    - us-east-1
                    - us-east-2
                    - eu-west-1

                size:
                  type: string
                  enum:
                    - small
                    - medium
                    - large

                engine:
                  type: string
                  enum:
                    - redis
                    - valkey

                replicas:
                  type: integer
                  minimum: 1
                  maximum: 5

                environment:
                  type: string
                  enum:
                    - dev
                    - staging
                    - prod

              