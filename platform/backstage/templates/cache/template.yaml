apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: cache
  title: Create Cache
  description: Create a managed cache through the internal platform

spec:
  owner: platform-team
  type: infrastructure


  parameters:
    - title: Cache Configuration

      required:
        - name
        - region
        - size
        - engine
        - environment

      properties:

        name:
          title: Cache Name
          type: string
          description: Name of the cache

        region:
          title: AWS Region
          type: string
          enum:
            - us-east-1
            - us-east-2
            - eu-west-1

        size:
          title: Cache Size
          type: string
          enum:
            - small
            - medium
            - large

        engine:
          title: Cache Engine
          type: string
          enum:
            - redis
            - valkey

        replicas:
          title: Replicas
          type: integer
          default: 1
          minimum: 1
          maximum: 5

        environment:
          title: Environment
          type: string
          enum:
            - dev
            - staging
            - prod

  spec:
  parameters:
    # GUI
    ...

  steps:

    - id: generate
      name: Generate Cache XR
      action: fetch:template

      input:
        url: ./skeleton
        targetPath: rendered

        values:
          name: ${{ parameters.name }}
          region: ${{ parameters.region }}
          size: ${{ parameters.size }}
          engine: ${{ parameters.engine }}
          replicas: ${{ parameters.replicas }}
          environment: ${{ parameters.environment }}


    - id: publish
      name: Publish Cache XR
      action: publish:github:pull-request

      input:
        repoUrl: repoUrl: github.com?owner=SantiagoLemoMayoral&repo=bank-AURORA-GLOBAL-DEFENSE

        branchName: create-cache-${{ parameters.name }}
        targetBranchName: main

        title: Create cache ${{ parameters.name }}
        commitMessage: Create cache ${{ parameters.name }}

        sourcePath: rendered

       targetPath: gitops/environments/${{ parameters.environment }}/${{ parameters.name }}